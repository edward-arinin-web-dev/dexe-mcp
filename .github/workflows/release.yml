name: Release

# Triggered by pushing a semver tag (e.g. `v0.5.9`). The job verifies the tag
# matches package.json, re-runs every gate CI runs on branches (tags bypass
# ci.yml entirely), then publishes to npm with a provenance attestation linking
# the tarball to this commit + workflow run.
#
# Two publish modes, both supported — the job picks one at runtime:
#
#   1. Automation token. Set repo secret NPM_TOKEN to an npm automation token
#      with publish rights. npm caps write tokens at 90 days, so this one
#      expires and has to be rotated; provenance is requested explicitly with
#      `--provenance`.
#   2. OIDC trusted publishing (no secret, nothing to rotate — preferred).
#      Leave NPM_TOKEN unset and configure the package on npmjs.com under
#      Settings → Trusted publisher:
#          Publisher:    GitHub Actions
#          Organization: edward-arinin-web-dev
#          Repository:   dexe-mcp
#          Workflow:     release.yml
#          Environment:  (leave empty)
#      Provenance is implied by publishConfig.provenance=true in package.json,
#      so the publish command passes no `--provenance` and no NODE_AUTH_TOKEN.
#      Requires npm >= 11.5.1, which is asserted below.
#
# Other requirements:
#   - Repo secret MAINTAINER_GPG_PUBLIC_KEY (ASCII-armored public key of the
#     maintainer who signs release tags; used by `git verify-tag`)
#   - id-token: write permission (granted below; needed for provenance and OIDC)
#
# To cut a release:
#   1. Bump package.json version (and CHANGELOG/README per release discipline)
#   2. git tag -s vX.Y.Z -m vX.Y.Z   (GPG-SIGNED tag — unsigned tags are rejected)
#   3. git push --tags
#   4. This workflow publishes and the provenance badge appears on npmjs.com
#
# `workflow_dispatch` runs the same gates against any ref without publishing —
# use it to rehearse a release before tagging.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every release gate against this ref; never publishes.'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Step-level `if:` cannot read `secrets`, so the decision between the two
      # publish modes is hoisted to a job-level env var here.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        # Pinned to a commit SHA — tags are mutable, and a compromised upstream
        # account could repoint `v6` at arbitrary code inside a job that holds
        # publish rights. Resolve an update with:
        #   gh api repos/actions/checkout/git/ref/tags/v6 -q .object.sha
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # Full history + tag objects so `git verify-tag` can read the
          # annotated tag and its GPG signature (shallow checkout omits them).
          fetch-depth: 0
          fetch-tags: true

      # Supply-chain guard: the release aborts unless the pushed tag carries a
      # valid GPG signature from the maintainer key. An unsigned or tampered tag
      # never reaches the publish step. Skipped on workflow_dispatch, which runs
      # against a branch ref with no tag to verify.
      - name: Import maintainer GPG public key
        if: github.event_name == 'push'
        env:
          MAINTAINER_GPG_PUBLIC_KEY: ${{ secrets.MAINTAINER_GPG_PUBLIC_KEY }}
        run: |
          if [ -z "$MAINTAINER_GPG_PUBLIC_KEY" ]; then
            echo "::error::MAINTAINER_GPG_PUBLIC_KEY secret is not set; cannot verify the tag signature. Add the maintainer's ASCII-armored public key as a repo secret."
            exit 1
          fi
          echo "$MAINTAINER_GPG_PUBLIC_KEY" | gpg --import

      - name: Verify tag is signed by maintainer
        if: github.event_name == 'push'
        run: |
          # actions/checkout lands the tag as a *lightweight* ref (peeled to the
          # commit), so `git verify-tag` would fail with "cannot verify a non-tag
          # object of type commit". Force-fetch the annotated tag object — with
          # its embedded GPG signature — back into refs/tags before verifying.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # `git verify-tag` exits non-zero when the tag is unsigned, the
          # signature is invalid, or the signing key is unknown to the keyring.
          git verify-tag "$GITHUB_REF_NAME"

      - name: Setup Node
        # Pinned to a commit SHA — see the checkout step. Resolve an update with:
        #   gh api repos/actions/setup-node/git/ref/tags/v6 -q .object.sha
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        # Node 24 ships npm 11.x. OIDC trusted publishing needs npm >= 11.5.1,
        # and Node 22's bundled npm 10.x is below that line — hence 24 here even
        # though the package supports Node >= 20.12 at runtime.
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Fail loudly and early rather than at `npm publish`, where a too-old npm
      # silently falls back to an unauthenticated publish attempt.
      - name: Assert npm supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          MIN=11.5.1
          echo "npm ${NPM_VERSION} (minimum for OIDC trusted publishing: ${MIN})"
          # `sort -V` orders versions naturally; if MIN is not the lower of the
          # two, the installed npm is older than MIN.
          if [ "$(printf '%s\n%s\n' "$MIN" "$NPM_VERSION" | sort -V | head -n1)" != "$MIN" ]; then
            echo "::error::npm ${NPM_VERSION} < ${MIN} — OIDC trusted publishing unavailable; bump node-version in release.yml"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag and package.json agree on ${PKG_VERSION}"

      # ---------------------------------------------------------------------
      # Gates mirrored from ci.yml. A tag push does NOT run ci.yml — that
      # workflow only fires on branches and pull requests — so without these
      # the publish path has no lockfile, dependency-tree, or audit gate at all.
      # That is how 0.33.0 shipped with three live advisories in its dependency
      # tree. `npm run gen:knowledge:check` is deliberately absent: it already
      # runs inside `npm publish` via the `prepublishOnly` script.
      # ---------------------------------------------------------------------
      - name: Assert lockfile unchanged by install
        run: git diff --exit-code package-lock.json

      - name: Validate dependency tree
        run: npm ls --all

      - name: Audit the shipped dependency tree
        run: |
          # Retried once: `npm audit` also exits non-zero when the registry's
          # audit endpoint blips, and a transient 5xx must not abort a release.
          if npm audit --omit=dev --audit-level=moderate; then
            exit 0
          fi
          echo "::warning::npm audit failed — retrying once in 30s in case the registry blipped"
          sleep 30
          npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Frontend↔MCP byte-diff for OTC calldata; needs dist/ from the build step.
      - name: Compat tests
        run: npm run test:compat

      - name: Resolve dist-tag
        id: disttag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A prerelease version (1.2.3-rc.1) must never take over `latest`.
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "dexe-mcp@${VERSION} will publish under dist-tag ${TAG}"

      # Mode 1: automation token in secrets.NPM_TOKEN.
      - name: Publish to npm (automation token)
        if: github.event_name == 'push' && env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mode 2: OIDC trusted publishing. No NODE_AUTH_TOKEN and no
      # `--provenance` flag — npm derives both from the OIDC identity and from
      # publishConfig.provenance=true in package.json.
      - name: Publish to npm (OIDC trusted publishing)
        if: github.event_name == 'push' && env.HAS_NPM_TOKEN != 'true'
        run: npm publish --access public --tag ${{ steps.disttag.outputs.tag }}

      # npm publish can return success before the new version is readable from
      # the registry. Poll so a green run really means "it is installable".
      # The window is 10 minutes: npm now answers "Your package is being
      # processed and may take a few minutes to become available", and 0.34.1
      # took ~2.5 minutes — the earlier 75 s window turned a good publish red.
      - name: Verify publish
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ATTEMPTS=40
          for attempt in $(seq 1 "$ATTEMPTS"); do
            PUBLISHED=$(npm view "dexe-mcp@${VERSION}" version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "dexe-mcp@${VERSION} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}/${ATTEMPTS}: dexe-mcp@${VERSION} not visible yet; waiting 15s"
            sleep 15
          done
          echo "::error::dexe-mcp@${VERSION} did not appear on the registry after ${ATTEMPTS} attempts (10 min). The publish step itself succeeded — check 'npm view dexe-mcp@${VERSION} version' by hand before re-tagging."
          exit 1
