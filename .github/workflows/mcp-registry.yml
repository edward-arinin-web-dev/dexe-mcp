name: MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) once a release has reached npm.
#
# A SEPARATE workflow file from release.yml, on purpose. npm's trusted
# publisher is bound to the workflow FILENAME: any job in release.yml that holds
# `id-token: write` can mint a token npm accepts for publishing dexe-mcp. This
# job has to run a downloaded third-party binary (mcp-publisher), and that must
# never happen inside a workflow npm trusts. Here the OIDC token is only good
# for the registry's own `github-oidc` login.
#
# Triggered by the same tag push as Release rather than by `workflow_run`: a
# `workflow_run` job that checks out the triggering commit is the
# untrusted-checkout pattern, and a tag push needs no ref plumbing at all. The
# two workflows therefore start together, and this one WAITS for npm — the
# registry stores metadata only and verifies the manifest against the PUBLISHED
# tarball (`mcpName` in package.json must equal `name` in server.json). If
# Release fails, nothing reaches npm and this run times out red, which is the
# right answer.
#
# To retry by hand: `gh workflow run mcp-registry.yml --ref vX.Y.Z`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Pinned release + digest: the binary is not built here and runs with an
      # OIDC token in hand. Resolve an update with:
      #   gh api repos/modelcontextprotocol/registry/releases/latest \
      #     --jq '.tag_name, (.assets[] | select(.name=="mcp-publisher_linux_amd64.tar.gz") | .digest)'
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Checkout
        # SHA-pinned: tags are mutable. Resolve an update with
        #   gh api repos/actions/checkout/git/ref/tags/v6 -q .object.sha
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Check the manifest against package.json
        run: |
          VERSION=$(jq -r .version package.json)
          MCP_NAME=$(jq -r '.mcpName // empty' package.json)
          if [ -z "$MCP_NAME" ]; then
            echo "::error::package.json at this ref has no mcpName — the registry cannot verify a release older than 0.35.0"
            exit 1
          fi
          if [ "$(jq -r .name server.json)" != "$MCP_NAME" ]; then
            echo "::error::server.json name does not match package.json mcpName (${MCP_NAME})"
            exit 1
          fi
          if [ "$(jq -r .version server.json)" != "$VERSION" ] || [ "$(jq -r '.packages[0].version' server.json)" != "$VERSION" ]; then
            echo "::error::server.json does not say ${VERSION} — run npm run bundle:plugin in the release commit"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "server.json ${MCP_NAME}@${VERSION} matches package.json"

      # Release runs its gates (~4 min) and npm then takes a few more to show
      # the version; 30 minutes covers both with room to spare.
      - name: Wait for the version on npm
        run: |
          ATTEMPTS=60
          for attempt in $(seq 1 "$ATTEMPTS"); do
            PUBLISHED=$(npm view "dexe-mcp@${VERSION}" version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "dexe-mcp@${VERSION} is live on npm"
              exit 0
            fi
            echo "attempt ${attempt}/${ATTEMPTS}: dexe-mcp@${VERSION} not on npm yet; waiting 30s"
            sleep 30
          done
          echo "::error::dexe-mcp@${VERSION} never appeared on npm — did the Release workflow publish? The registry only lists published packages."
          exit 1

      - name: Install mcp-publisher (pinned, digest-checked)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
